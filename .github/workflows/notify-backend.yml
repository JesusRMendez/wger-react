# After a push to master: run the CI (tests, lint, type-check) and a production
# build and then tell the wger backend repository that the React web changed, so
# that it rebuilds and redeploys QA (workflow deploy-qa.yml, event `react-updated`).
#
# ci.yml and lint.yml are reused through workflow_call. They exclude master from
# their own push trigger so that a push to master doesn't run them twice.
#
# Required secret: BACKEND_DISPATCH_TOKEN, a fine-grained personal access token
#   * Resource owner: the owner of the backend repository
#   * Repository access: only the backend repository
#   * Repository permissions: Contents: Read and write (needed for the
#     repository_dispatch endpoint), Metadata: Read-only (automatic)
# Optional variable: BACKEND_REPO (default JesusRMendez/wger)
# Without the secret the notification is skipped with a notice.
name: Notify backend

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-backend
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npm run build

  notify:
    name: Dispatch react-updated
    needs: [ci, lint, build]
    runs-on: ubuntu-latest
    env:
      BACKEND_REPO: ${{ vars.BACKEND_REPO || 'JesusRMendez/wger' }}
      BACKEND_DISPATCH_TOKEN: ${{ secrets.BACKEND_DISPATCH_TOKEN }}
    steps:
      - name: Send repository_dispatch
        run: |
          if [ -z "$BACKEND_DISPATCH_TOKEN" ]; then
            echo "::notice title=Backend not notified::secret BACKEND_DISPATCH_TOKEN is not set, skipping the repository_dispatch to $BACKEND_REPO"
            exit 0
          fi
          payload=$(jq -nc --arg ref "$GITHUB_SHA" '{event_type: "react-updated", client_payload: {ref: $ref}}')
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $BACKEND_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$BACKEND_REPO/dispatches" \
            -d "$payload")
          if [ "$status" != "204" ]; then
            echo "::error::repository_dispatch to $BACKEND_REPO failed with HTTP $status"
            cat response.txt
            exit 1
          fi
          echo "Notified $BACKEND_REPO (react-updated, ref $GITHUB_SHA)"
