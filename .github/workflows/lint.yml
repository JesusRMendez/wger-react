name: Lint the code

on:
  # Called by notify-backend.yml, which is the one that runs for pushes to master
  workflow_call:
  push:
    branches:
      - '*'
      - '!master'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint the code
        run: npm run lint

      - name: Type-check
        run: npm run typecheck